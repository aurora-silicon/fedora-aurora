# Aurora built its packages without a vendor until aurora-release 44-7.
# Those installed copies may move to Aurora's vendored builds or to
# Fedora's. The list is the packages Aurora carried then and never grows.
version = '1.1'

[[outgoing_vendors]]
vendor = ''

[[incoming_vendors]]
vendor = 'Aurora Silicon'

[[incoming_vendors]]
vendor = 'Fedora Project'

[[outgoing_packages]]
filters = [
  { filter = 'source_name', value = 'abrt' }
]

