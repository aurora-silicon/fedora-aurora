# Packages from the Aurora repository replace Fedora's, and Fedora's replace
# Aurora's when Aurora stops carrying a package or Fedora's is newer.
# Fedora Asahi Remix sets allow_vendor_change=False, so without this rule
# dnf would keep whichever vendor is installed.
version = '1.1'

[[equivalent_vendors]]
vendor = 'Aurora Silicon'

[[equivalent_vendors]]
vendor = 'Fedora Project'
