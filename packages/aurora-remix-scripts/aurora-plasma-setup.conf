# Aurora creates the Linux owner before the display manager starts. Plasma
# Setup stays available on unmanaged systems; on Aurora it waits for Aurora's
# setup and is skipped, never failed, while that setup is pending and once it
# has created the owner.
[Unit]
After=aurora-firstboot.service
ConditionPathExists=!/var/lib/aurora/firstboot/pending
ConditionPathExists=!/var/lib/aurora/firstboot/complete
