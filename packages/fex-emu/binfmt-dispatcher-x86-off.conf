# Aurora's fex-emu: this file has the name of a binfmt-dispatcher x86 handler
# file in /usr/lib/binfmt.d and registers nothing, so that handler stays off.
# FEX's own handlers, FEX-x86 and FEX-x86_64, then run every x86 program, on
# a Fedora Asahi Remix upgrade as on a fresh install. binfmt-dispatcher's
# handlers register after FEX's and would take x86 programs from them.
#
# To turn binfmt-dispatcher's x86 handlers back on, put its files here:
#
#   sudo cp /usr/lib/binfmt.d/zz-binfmt-dispatcher-x86*.conf /etc/binfmt.d/
#   sudo systemctl restart systemd-binfmt.service
