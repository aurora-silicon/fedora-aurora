# The Neural Engine is not needed to mount the root file system. Keep its
# driver out of the initramfs: it boots the ANE firmware in its probe, about
# 1.2 s on the M2, and while that probe runs the initramfs udevd cannot stop,
# so the switch to the real root waits for it. udev loads the driver from the
# real root instead, in parallel with the rest of the boot.
omit_drivers+=" ane_t6021 "
