# The CPU frequency driver runs the cores at their performance states from the
# initramfs on. Without it every core stays at the clock the boot loader left
# until udev on the real root loads the driver: on a MacBook Neo (A18 Pro)
# that is the 744 MHz hand-off clock until 7.2 s into the boot, with the
# initramfs, the switch to the real root and the first services all on it.
# The driver binds by the cluster controllers' compatible, so it loads on
# every Apple silicon Mac and does nothing elsewhere.
add_drivers+=" apple-soc-cpufreq "
