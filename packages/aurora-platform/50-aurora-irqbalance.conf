# irqbalance spreads interrupts by writing /proc/irq/*/smp_affinity. From the
# M1 Pro and M2 on, the Apple interrupt controller (AICv2 and later) cannot
# steer an interrupt: it hands each one to a CPU that accepts interrupts,
# whatever the mask. irqbalance then failed on every PCIe MSI, logged that it
# gave up on each, and still woke up every ten seconds. Run it only where it
# can work: on other hardware, and on the M1 (T8103), whose AIC can steer.
[Unit]
ConditionFirmware=|!device-tree-compatible(apple,arm-platform)
ConditionFirmware=|device-tree-compatible(apple,t8103)
