# The crash kernel's initramfs needs the Apple NVMe driver to write the dump.
# kdump-utils' own 99-kdump.conf sets add_dracutmodules= (not +=), which drops
# dracut-asahi's kernel-modules-asahi, and its strict host-only build does not
# detect nvme-apple. This file sorts after 99-kdump.conf.
add_drivers+=" nvme_apple "
# Date the dump from the PMU RTC: the crash kernel has no SMC RTC.
add_dracutmodules+=" aurora-kdump-clock "
# The crash kernel only saves the dump. Leave out the drivers of coprocessors
# and buses the crashed kernel left running (GPU, display, Thunderbolt, AOP,
# PMP, ANE, audio, USB, keyboard, the I2C bus of the USB-C port controllers):
# probing them live can stall the crash kernel before nvme_apple loads (M1 Pro,
# M2).
omit_drivers+=" aurora appledrm dcp[-_]fabric[-_]core apple[-_]dcp mux[-_]apple[-_]display[-_]crossbar phy[-_]apple[-_]dptx thunderbolt thunderbolt[-_]apple aop apple[-_]pmp ane[-_].* apple[-_]admac apple[-_]sio snd.* soundcore dwc3.* xhci[-_]plat[-_]hcd udc[-_]core ulpi tps6598x.* typec phy[-_]apple[-_]atc spi[-_]hid[-_]apple.* dockchannel[-_]hid hid[-_]apple.* hid[-_]magicmouse apple[-_]dockchannel macsmc[-_]hwmon macsmc[-_]power gpio[-_]macsmc pwm[-_]apple mmc[-_]core qrtr i2c[-_]pasemi.* i2c[-_]dev spi[-_]apple xhci.* macsmc[-_]reboot clk[-_]apple[-_]nco "
# kdump-utils builds the initramfs as a squashfs image behind a small busybox
# /init. With dracut 108 (Fedora 44) that /init never loaded its first module
# in the crash kernel on the M2, so no dump was saved; a plain initramfs boots
# straight into systemd.
omit_dracutmodules+=" squash squash-squashfs squash-erofs squash-lib "
