# Keep Plasma Setup's autostart entry non-executable.
#
# plasma-setup-tmpfiles.conf sets every file in the setup user's home to
# 0750, so systemd-xdg-autostart-generator warns that the entry is marked
# executable on every boot until setup completes. Lines that adjust modes run
# in file name order, so this file must sort after plasma-setup-tmpfiles.conf.
# Remove it once plasma-setup stops giving its files execute bits.
z /run/plasma-setup/.config/autostart/*.desktop 0640 - - -
