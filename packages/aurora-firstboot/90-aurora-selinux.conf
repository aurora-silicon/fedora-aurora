# Select by the kernel being packaged, including upgrades from a running kernel
# without SELinux. The standard hook handles /.autorelabel before switch-root.
if grep -qx 'CONFIG_SECURITY_SELINUX=y' "${dracutsysrootdir:-}/usr/lib/modules/${kernel}/config" 2>/dev/null; then
    add_dracutmodules+=" selinux "
fi
