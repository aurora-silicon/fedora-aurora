# The SEP driver's defaults: xART writes and first-boot keybag provisioning on.
# /etc/modprobe.d/aurora-sep.conf replaces this file, and a read-only install
# puts "options apple_sep xart_writes=0 provision_keybag=0" there. On the M5
# Pro and Max (T6050) aurora-sep-load puts those read-only options in
# /run/modprobe.d/aurora-sep.conf at boot, which replaces this file, and the
# owner opts in to writes with the /etc file, which must then set both
# options (see XART-SAFETY.md).
options apple_sep xart_writes=1 provision_keybag=1
