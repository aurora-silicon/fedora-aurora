name: Fedora RPM builds
on:
  push:
    branches: [main]
    paths: [packages/**, scripts/**, sources.json, .github/workflows/rpms.yml]
  pull_request:
  workflow_dispatch:
    inputs:
      firefox_avd:
        description: Build and verify the Fedora 45 Firefox AVD candidate on its review branch only
        type: boolean
        default: false
      packages:
        description: Space-separated packages; empty builds the entire set
        default: ''
permissions:
  contents: read
defaults:
  run:
    shell: bash
concurrency:
  group: rpm-${{ github.ref }}
  cancel-in-progress: false
jobs:
  plan:
    if: ${{ !inputs.firefox_avd }}
    runs-on: ubuntu-24.04
    outputs:
      packages: ${{ steps.plan.outputs.packages }}
      x86_packages: ${{ steps.plan.outputs.x86_packages }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: plan
        run: |
          python3 scripts/ci-plan.py >> "$GITHUB_OUTPUT"
  rpm:
    needs: plan
    if: needs.plan.outputs.packages != '[]'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        package: ${{ fromJSON(needs.plan.outputs.packages) }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Prepare graphics build capacity
        if: matrix.package == 'aurora-flatpak-gl' || matrix.package == 'mesa-aurora'
        run: |
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/dotnet
          df -h "$RUNNER_TEMP"
          test "$(df --output=avail -B1 "$RUNNER_TEMP" | tail -1)" -ge 21474836480
      - name: Build Fedora 44 RPMs natively
        run: |
          set -euo pipefail
          # bubblewrap needs namespaces/mounts for the unprivileged GL builder.
          sandbox=()
          if [[ '${{ matrix.package }}' == aurora-flatpak-gl ]]; then sandbox=(--privileged); fi
          docker run --rm "${sandbox[@]}" --platform linux/arm64 -v "$PWD:/src" -w /src \
            registry.fedoraproject.org/fedora:44 bash -euo pipefail -c '
              dnf install -y rpm-build dnf5-plugins python3 git tar gzip coreutils findutils
              if [[ $1 == aurora-flatpak-gl ]]; then
                dnf install -y flatpak flatpak-builder ostree
                useradd -m glbuilder
                mkdir -p /src/out/flatpak-gl
                chown glbuilder /src/out/flatpak-gl
                runuser -u glbuilder -- bash scripts/build-flatpak-gl-repo /src/out/flatpak-gl/repo.tar
                export AURORA_FLATPAK_GL_REPO_TAR=/src/out/flatpak-gl/repo.tar
              fi
              AURORA_INSTALL_BUILDDEPS=1 AURORA_BUILD_JOBS=4 bash scripts/build-rpm "$1"
            ' build '${{ matrix.package }}' 2>&1 | tee build.log
      # Provenance for the exact RPM bytes; publication verifies it.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: success() && github.event_name != 'pull_request'
        with:
          subject-path: |
            out/rpms/*.rpm
            out/srpms/*.rpm
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: success()
        with:
          name: rpm-${{ matrix.package }}
          path: |
            out/rpms/*.rpm
            out/srpms/*.rpm
            out/manifests/*.json
            build.log
          retention-days: 30
      # A failed attempt keeps its log under a name publication never reads.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: failed-rpm-${{ matrix.package }}-attempt-${{ github.run_attempt }}
          path: build.log
          retention-days: 14
  rpm-x86:
    # Recipes that ship x86 code for FEX guests (marked "# aurora-builder: x86_64").
    needs: plan
    if: needs.plan.outputs.x86_packages != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        package: ${{ fromJSON(needs.plan.outputs.x86_packages) }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Build Fedora 44 RPMs on x86_64
        run: |
          set -euo pipefail
          docker run --rm --platform linux/amd64 -v "$PWD:/src" -w /src \
            registry.fedoraproject.org/fedora:44 bash -euo pipefail -c '
              dnf install -y rpm-build dnf5-plugins python3 git tar gzip coreutils findutils
              AURORA_INSTALL_BUILDDEPS=1 AURORA_BUILD_JOBS=4 bash scripts/build-rpm "$1"
            ' build '${{ matrix.package }}' 2>&1 | tee build.log
      # Provenance for the exact RPM bytes; publication verifies it.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: success() && github.event_name != 'pull_request'
        with:
          subject-path: |
            out/rpms/*.rpm
            out/srpms/*.rpm
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: success()
        with:
          name: rpm-${{ matrix.package }}
          path: |
            out/rpms/*.rpm
            out/srpms/*.rpm
            out/manifests/*.json
            build.log
          retention-days: 30
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: failed-rpm-${{ matrix.package }}-attempt-${{ github.run_attempt }}
          path: build.log
          retention-days: 14

  firefox-avd:
    if: github.event_name == 'workflow_dispatch' && inputs.firefox_avd && github.ref == 'refs/heads/avd/browser-fedora-t4366'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Prepare build capacity
        run: |
          test "$(uname -m)" = aarch64
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/dotnet
          df -h .
          free -h
          # Extra paging capacity for gkrust alongside native C++ compilation.
          swap="$RUNNER_TEMP/firefox-avd-${GITHUB_RUN_ID}.swap"
          sudo fallocate -l 16G "$swap"
          sudo chmod 600 "$swap"
          sudo mkswap "$swap"
          sudo swapon "$swap"
          free -h
      - name: Build and verify the unchanged Fedora 45 candidate natively
        run: |
          set -euo pipefail
          mkdir -p out/firefox-fc45
          git rev-parse HEAD > out/firefox-fc45/workflow-commit.txt
          # Source/spec/build recipe must remain byte-identical to the reviewed candidate.
          test -z "$(git diff 96c4cacc29c4e07c8211a68ea7a38ffb5d702c56 -- docs/firefox packages sources.json)"
          docker run --rm --platform linux/arm64 --cpus 4 \
            -v "$PWD:/src" -w /src -e BUILD_OUT=/src/out \
            registry.fedoraproject.org/fedora:45 bash -euo pipefail -c '
              test "$(uname -m)" = aarch64
              test "$(rpm -E "%fedora")" = 45
              dnf install -y rpm-build dnf5-plugins python3 git tar gzip xz coreutils findutils gcc-c++ kernel-headers gnupg2
              export AURORA_INSTALL_BUILDDEPS=1 AURORA_BUILD_JOBS=2
              export CARGO_BUILD_JOBS=2 CMAKE_BUILD_PARALLEL_LEVEL=2
              bash scripts/build-rpm ffmpeg-avd
              bash scripts/build-rpm libva-v4l2-request
              bash scripts/build-firefox-avd-fedora
              bash scripts/verify-firefox-avd-fedora
            ' 2>&1 | python3 -u scripts/redact-build-log.py | tee out/native-build.log
      - name: Collect candidate manifest and redact retained logs
        if: always()
        run: |
          for log in out/firefox-fc45/build.log out/firefox-fc45/install-check.log; do
            if test -f "$log"; then
              python3 scripts/redact-build-log.py < "$log" > "$log.redacted"
              mv "$log.redacted" "$log"
            fi
          done
          {
            for directory in out/rpms out/srpms out/firefox-fc45/RPMS out/firefox-fc45/SRPMS; do
              if test -d "$directory"; then find "$directory" -type f -name '*.rpm' -print0; fi
            done
          } | sort -z | xargs -0 -r sha256sum > out/SHA256SUMS
          free -h
          df -h .
          sudo dmesg | grep -Ei 'out of memory|oom-kill|killed process' > out/memory-events.log || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: firefox-avd-fedora45-aarch64
          path: |
            out/firefox-fc45/RPMS/**/*.rpm
            out/firefox-fc45/SRPMS/*.rpm
            out/firefox-fc45/build.log
            out/firefox-fc45/install-check.log
            out/firefox-fc45/candidate-inputs.sha256
            out/firefox-fc45/fedora-sources
            out/firefox-fc45/workflow-commit.txt
            out/rpms/*.rpm
            out/srpms/*.rpm
            out/native-build.log
            out/SHA256SUMS
            out/memory-events.log
          if-no-files-found: error
          retention-days: 30
