name: Publish a signed Fedora Edge snapshot
# Fedora 44 uses a signed RPM overlay. Fedora 45 uses the signed Testing
# package set with the selected Linux and Mesa pair. Both deploy through the
# adopted aurora-distributions Edge train.
on:
  workflow_dispatch:
    inputs:
      linux-publication:
        description: Successful Linux Edge kernel-release run ID and attempt (RUN_ID/ATTEMPT)
        required: true
      fedora-release:
        description: Fedora release of the signed Edge snapshot
        type: choice
        options: ['44', '45']
        default: '44'
      signing-run:
        description: Fedora 44 only, successful edge-f44-sign-rpms.yml run on main holding the signed Edge RPMs
        default: ''
      mesa-signing-run:
        description: Optional edge-f44-sign-mesa-replacement.yml run on main whose Mesa replaces the signing run's
        default: ''
      base-release:
        description: Signed Testing snapshot of the selected Fedora release
        required: true
      release-tag:
        description: Optional new tag. Defaults to edge-YYYYMMDD.N or edge-f45-YYYYMMDD.N
        default: ''
permissions: {}
defaults:
  run:
    shell: bash
concurrency:
  group: repository-publication-edge
  cancel-in-progress: false
env:
  FEDORA_RELEASE: ${{ inputs.fedora-release }}
  FEDORA_IMAGE: ${{ inputs.fedora-release == '45' && 'registry.fedoraproject.org/fedora:45' || 'registry.fedoraproject.org/fedora:44@sha256:b96f024cecbe9515eb049107d2856e7ad923f7aac09a3c90e7a0d52a46fa3454' }}
jobs:
  collect:
    if: github.repository == 'aurora-silicon/fedora-aurora' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read
      attestations: read
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      digest: ${{ steps.candidate.outputs.digest }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release-tag }}
          BASE_RELEASE: ${{ inputs.base-release }}
          SIGNING_RUN: ${{ inputs.signing-run }}
          MESA_SIGNING_RUN: ${{ inputs.mesa-signing-run }}
        run: |
          set -euo pipefail
          if [[ $FEDORA_RELEASE == 44 ]]; then
            [[ $SIGNING_RUN =~ ^[1-9][0-9]*$ ]]
            prefix=edge-
          elif [[ $FEDORA_RELEASE == 45 ]]; then
            [[ -z $SIGNING_RUN && -z $MESA_SIGNING_RUN ]]
            prefix=edge-f45-
          else
            exit 2
          fi
          python3 -c 'import os,sys; sys.path.insert(0,"scripts"); import fedoralib; fedoralib.snapshot(os.environ["BASE_RELEASE"], os.environ["FEDORA_RELEASE"])'
          if [[ -z $RELEASE_TAG ]]; then
            RELEASE_TAG=$(git tag --list "$prefix*" | python3 scripts/next-tag.py "$prefix")
          fi
          python3 -c 'import os,sys; sys.path.insert(0,"scripts"); import edgelib; edgelib.snapshot(os.environ["RELEASE_TAG"], os.environ["FEDORA_RELEASE"])'
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists" >&2; exit 1
          fi
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
      - name: Authenticate the signed Edge RPMs and their packaged sources
        if: inputs.fedora-release == '44'
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNING_RUN: ${{ inputs.signing-run }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SIGNING_RUN" > signing-run.json
          jq -e '.conclusion=="success" and .head_branch=="main" and .path==".github/workflows/edge-f44-sign-rpms.yml"
                 and .head_repository.full_name=="aurora-silicon/fedora-aurora"' signing-run.json
          head=$(jq -r .head_sha signing-run.json)
          gh run download "$SIGNING_RUN" --repo "$GITHUB_REPOSITORY" -n f44-edge-signed-rpms -D signed
          for subject in signed/equivalence.json signed/rpms/*.rpm; do
            gh attestation verify "$subject" --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/edge-f44-sign-rpms.yml" \
              --source-digest "$head" --deny-self-hosted-runners
          done
          # The attestation covers only the RPMs and equivalence.json: read the package run
          # from the API by its id, never from the artifact's own build-run.json.
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$(jq -r .id signed/build-run.json)" > package-run.json
          jq -e '.conclusion=="success" and .path==".github/workflows/rpms.yml"
                 and (.head_branch | startswith("edge-staging/"))
                 and .head_repository.full_name=="aurora-silicon/fedora-aurora"' package-run.json
          package_head=$(jq -r .head_sha package-run.json)
          [[ $package_head == "$(jq -r .head_sha signed/build-run.json)" ]]
          gh api "repos/$GITHUB_REPOSITORY/contents/sources.json?ref=$package_head" \
            -H 'Accept: application/vnd.github.raw+json' > edge-build-sources.json
      - name: Authenticate the Mesa replacement signer
        if: inputs.fedora-release == '44' && inputs.mesa-signing-run != ''
        env:
          GH_TOKEN: ${{ github.token }}
          MESA_SIGNING_RUN: ${{ inputs.mesa-signing-run }}
        run: |
          set -euo pipefail
          [[ $MESA_SIGNING_RUN =~ ^[1-9][0-9]*$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$MESA_SIGNING_RUN" > mesa-signing-run.json
          jq -e '.conclusion=="success" and .head_branch=="main" and .path==".github/workflows/edge-f44-sign-mesa-replacement.yml"
                 and .head_repository.full_name=="aurora-silicon/fedora-aurora"' mesa-signing-run.json
          head=$(jq -r .head_sha mesa-signing-run.json)
          artifact=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$MESA_SIGNING_RUN/artifacts" \
            --jq '[.artifacts[] | select(.expired == false and (.name | startswith("f44-edge-signed-mesa-")))] | if length == 1 then .[0].name else error("expected one signed Mesa artifact") end')
          gh run download "$MESA_SIGNING_RUN" --repo "$GITHUB_REPOSITORY" -n "$artifact" -D signed-mesa
          for subject in signed-mesa/equivalence.json signed-mesa/rpms/*.rpm; do
            gh attestation verify "$subject" --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/edge-f44-sign-mesa-replacement.yml" \
              --source-digest "$head" --deny-self-hosted-runners
          done
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$(jq -r .id signed-mesa/build-run.json)" > mesa-package-run.json
          jq -e '.conclusion=="success" and .path==".github/workflows/rpms.yml"
                 and (.head_branch | startswith("edge-staging/"))
                 and .head_repository.full_name=="aurora-silicon/fedora-aurora"' mesa-package-run.json
          package_head=$(jq -r .head_sha mesa-package-run.json)
          [[ $package_head == "$(jq -r .head_sha signed-mesa/build-run.json)" ]]
          gh api "repos/$GITHUB_REPOSITORY/contents/sources.json?ref=$package_head" \
            -H 'Accept: application/vnd.github.raw+json' > edge-mesa-sources.json
          echo "MESA_ARGS=--mesa-edge signed-mesa/rpms --mesa-sources edge-mesa-sources.json --mesa-signing-run $MESA_SIGNING_RUN" >> "$GITHUB_ENV"
      - name: Authenticate the Testing base snapshot
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_RELEASE: ${{ inputs.base-release }}
        run: |
          set -euo pipefail
          build_args=()
          if [[ $FEDORA_RELEASE == 45 ]]; then build_args+=(--pattern builds.json); fi
          gh release download "$BASE_RELEASE" --repo "$GITHUB_REPOSITORY" --dir base \
            --pattern '*.rpm' --pattern manifest.json --pattern SHA256SUMS "${build_args[@]}"
          provenance=()
          if [[ $FEDORA_RELEASE == 45 ]]; then
            base_commit=$(jq -er '.publishing_commit' base/builds.json)
            [[ $base_commit =~ ^[0-9a-f]{40}$ ]]
            provenance+=(--source-ref refs/heads/main --source-digest "$base_commit")
          fi
          gh attestation verify base/manifest.json --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/publish.yml" \
            "${provenance[@]}" --deny-self-hosted-runners --format json > base-attestation.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          listed = {}
          for line in Path('base/SHA256SUMS').read_text().splitlines():
              digest, name = line.split(maxsplit=1)
              listed[name.lstrip('*')] = digest
          if not {rpm.name for rpm in Path('base').glob('*.rpm')} <= listed.keys():
              raise ValueError('a downloaded base RPM is outside the attested checksums')
          subjects = ({(s['name'], s['digest']['sha256']) for s in v['verificationResult']['statement']['subject']}
                      for v in json.load(open('base-attestation.json')))
          if not any(listed.items() <= statement for statement in subjects):
              raise ValueError('the base snapshot attestation does not cover every asset')
          PY
          (cd base && sha256sum --strict --ignore-missing -c SHA256SUMS)
          if [[ $FEDORA_RELEASE == 45 ]]; then
            python3 scripts/verify-edge-base.py base --repository "$GITHUB_REPOSITORY" > base-publication.json
            mkdir "$RUNNER_TEMP/edge-base-source"
            git fetch --no-tags --depth 1 origin "$base_commit"
            git archive "$base_commit" sources.json packages | tar -xf - -C "$RUNNER_TEMP/edge-base-source"
            python3 - "$RUNNER_TEMP/edge-base-source" <<'PY' > edge-build-sources.json
          import json, sys
          sys.path.insert(0, 'scripts')
          import fedoralib
          print(json.dumps(fedoralib.sources(sys.argv[1], 45)))
          PY
          fi
      - id: packaged-sources
        name: Read the packaged Linux and Mesa revisions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          linux=$(jq -r '.["kernel-aurora"].commit' edge-build-sources.json)
          mesa_sources=edge-build-sources.json
          [[ ! -f edge-mesa-sources.json ]] || mesa_sources=edge-mesa-sources.json
          mesa=$(jq -r '.["mesa-aurora"].commit' "$mesa_sources")
          [[ $linux =~ ^[0-9a-f]{40}$ && $mesa =~ ^[0-9a-f]{40}$ ]]
          printf 'linux=%s\nmesa=%s\n' "$linux" "$mesa" >> "$GITHUB_OUTPUT"
      - id: linux-publication
        uses: aurora-silicon/linux/.github/actions/verify-edge-source@5d340223ef75e9fcb691e83c54bcf1c82dd3973e
        with:
          revision: ${{ steps.packaged-sources.outputs.linux }}
          publication: ${{ inputs.linux-publication }}
          token: ${{ github.token }}
      - name: Verify Mesa ancestry and record the packaged source trees
        env:
          GH_TOKEN: ${{ github.token }}
          LINUX: ${{ steps.packaged-sources.outputs.linux }}
          MESA: ${{ steps.packaged-sources.outputs.mesa }}
          LINUX_SOURCE_SHA256: ${{ steps.linux-publication.outputs.source-sha256 }}
        run: |
          set -euo pipefail
          linux=$LINUX mesa=$MESA
          [[ $LINUX_SOURCE_SHA256 =~ ^[0-9a-f]{64}$ ]]
          mesa_repo=aurora-silicon/mesa
          [[ $(gh api "repos/$mesa_repo" --jq .default_branch) == aurora-wip ]]
          mesa_tip=$(gh api "repos/$mesa_repo/git/ref/heads/aurora-wip" --jq .object.sha)
          [[ $mesa_tip =~ ^[0-9a-f]{40}$ ]]
          gh api "repos/$mesa_repo/compare/$mesa...$mesa_tip" --jq .status | grep -Eqx 'ahead|identical'
          jq -n --arg linux "$(gh api "repos/aurora-silicon/linux/git/commits/$linux" --jq .tree.sha)" \
                --arg mesa "$(gh api "repos/aurora-silicon/mesa/git/commits/$mesa" --jq .tree.sha)" \
                --arg linux_release_sha256 "$LINUX_SOURCE_SHA256" \
                '{linux: $linux, mesa: $mesa, linux_release_sha256: $linux_release_sha256}' > edge-trees.json
      - id: candidate
        name: Assemble the Edge snapshot from verified, signed RPMs
        env:
          BASE_RELEASE: ${{ inputs.base-release }}
          SIGNING_RUN: ${{ inputs.signing-run }}
        run: |
          set -euo pipefail
          docker run --rm -e FEDORA_RELEASE -e BASE_RELEASE -e SIGNING_RUN -e MESA_ARGS -v "$PWD:/src" -w /src "$FEDORA_IMAGE" bash -euo pipefail -c '
            dnf install -y python3 rpm
            rpmkeys --import keys/RPM-GPG-KEY-aurora
            for rpm in base/*.rpm signed/rpms/*.rpm signed-mesa/rpms/*.rpm; do
              [[ -e $rpm ]] || continue
              case "$rpm" in *.src.rpm|*.nosrc.rpm) continue ;; esac
              [[ $(rpmkeys --checksig "$rpm") == *"digests signatures OK"* ]] || { echo "unsigned: $rpm" >&2; exit 1; }
            done
            if [[ $FEDORA_RELEASE == 45 ]]; then
              mode=(--signed-base --base-record base-publication.json)
            else
              mode=(--edge signed/rpms --signing-run "$SIGNING_RUN")
            fi
            python3 scripts/edge-snapshot.py --base base "${mode[@]}" --sources edge-build-sources.json \
              --trees edge-trees.json --record candidate/edge-sources.json --output candidate/complete-rpms \
              --base-release "$BASE_RELEASE" ${MESA_ARGS:-}
            # The base keeps its other packages as they are, so an Edge kernel or Mesa
            # whose Requires they do not satisfy would be skipped by dnf: refuse it.
            bash scripts/check-repository-closure candidate/complete-rpms
          '
          sudo chown -R "$(id -u):$(id -g)" candidate
          tar --sort=name --owner=0 --group=0 --numeric-owner --mtime=@0 -cf candidate.tar -C candidate .
          echo "digest=$(sha256sum candidate.tar | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: unsigned-edge-candidate
          path: candidate.tar
          compression-level: 0
          retention-days: 7

  # The RPM key lives in the testing-signing environment (main only). The
  # signer re-verifies the candidate digest and signs inside a container
  # without network access; the Edge RPMs already carry the same signature.
  sign:
    needs: collect
    runs-on: ubuntu-24.04-arm
    environment: testing-signing
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: unsigned-edge-candidate
      - env:
          DIGEST: ${{ needs.collect.outputs.digest }}
        run: |
          echo "$DIGEST  candidate.tar" | sha256sum -c -
          mkdir candidate && tar -xf candidate.tar -C candidate
          docker build -t aurora-signer - <<EOF
          FROM $FEDORA_IMAGE
          RUN dnf install -y rpm-build redhat-rpm-config rpm-sign gnupg2 createrepo_c python3 && dnf clean all
          EOF
      - name: Sign the Edge repository metadata
        env:
          FEDORA_RPM_SIGNING_KEY: ${{ secrets.FEDORA_RPM_SIGNING_KEY }}
          FEDORA_RPM_SIGNING_PASSPHRASE: ${{ secrets.FEDORA_RPM_SIGNING_PASSPHRASE }}
          RELEASE_TAG: ${{ needs.collect.outputs.tag }}
        run: |
          set -euo pipefail
          jq -n '{key: env.FEDORA_RPM_SIGNING_KEY, passphrase: env.FEDORA_RPM_SIGNING_PASSPHRASE}' |
            docker run --rm -i --network none -v "$PWD:/src" -w /src aurora-signer \
              python3 scripts/sign-repository.py --fedora-release "$FEDORA_RELEASE" --channel edge --credentials-stdin \
                --presigned-rpms --rpms candidate/complete-rpms --output site --snapshot "$RELEASE_TAG" \
                --asset-base "https://github.com/$GITHUB_REPOSITORY/releases/download/$RELEASE_TAG"
          sudo chown -R "$(id -u):$(id -g)" site
          cp candidate/edge-sources.json site/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: signed-edge-snapshot
          path: site
          compression-level: 0
          retention-days: 7

  release:
    needs: [collect, sign]
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: signed-edge-snapshot
          path: site
      - name: Verify every signature against the committed key
        run: |
          set -euo pipefail
          docker run --rm -e FEDORA_RELEASE -v "$PWD:/src" -w /src "$FEDORA_IMAGE" bash -euo pipefail -c '
            rpmkeys --import keys/RPM-GPG-KEY-aurora
            for rpm in site/"$FEDORA_RELEASE"/edge/aarch64/*.rpm; do
              [[ $(rpmkeys --checksig "$rpm") == *"digests signatures OK"* ]] || { echo "unsigned: $rpm" >&2; exit 1; }
            done
          '
          export GNUPGHOME="$RUNNER_TEMP/verify"
          mkdir -m 0700 "$GNUPGHOME"
          gpg --batch --import keys/RPM-GPG-KEY-aurora
          repository="site/$FEDORA_RELEASE/edge/aarch64"
          gpg --batch --verify "$repository/repodata/repomd.xml.asc" "$repository/repodata/repomd.xml"
          for archive in site/repository-metadata-*.tar.gz; do gpg --batch --verify "$archive.asc" "$archive"; done
          jq -e '.dry_run != true and .channel == "edge" and .signing_key == $fpr and .fedora == $release' \
            --argjson release "$FEDORA_RELEASE" --arg fpr "$(cat keys/fingerprint.txt)" \
            "$repository/manifest.json"
          jq -e '.schema == 1 and .channel == "edge" and .kernel_release.tag == "aurora-edge"
                 and (.kernel_release.source_sha256 | test("^[0-9a-f]{64}$"))' site/edge-sources.json
          if [[ $FEDORA_RELEASE == 45 ]]; then
            jq -e '(.base_publication.packaging_commit | test("^[0-9a-f]{40}$"))
                  and ([.base_publication.manifest_sha256, .base_publication.builds_sha256]
                       | all(test("^[0-9a-f]{64}$")))' site/edge-sources.json
          fi
          mkdir assets
          cp "$repository"/*.rpm "$repository/manifest.json" site/RPM-GPG-KEY-aurora site/edge-sources.json \
            site/repository-metadata-*.tar.gz site/repository-metadata-*.tar.gz.asc assets/
          (cd assets && sha256sum -- * > ../SHA256SUMS) && mv SHA256SUMS assets/
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: assets/SHA256SUMS
      - name: Publish the immutable Edge snapshot
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.collect.outputs.tag }}
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" assets/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --prerelease --title "Fedora Aurora $RELEASE_TAG" \
            --notes 'Signed Edge package set: a Testing snapshot with the kernel and Mesa of one aurora-edge pair (edge-sources.json). Every asset carries a GitHub build provenance attestation (SHA256SUMS). The Edge feed serves it only after the Edge train that names it is adopted.'
          echo "Published [$RELEASE_TAG](https://github.com/$GITHUB_REPOSITORY/releases/tag/$RELEASE_TAG)." >> "$GITHUB_STEP_SUMMARY"
