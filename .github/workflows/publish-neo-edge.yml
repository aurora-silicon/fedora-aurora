name: Publish qualified Fedora 44 Neo Edge payload
on:
  workflow_dispatch:
    inputs:
      qualification:
        description: Exact-pair owner evidence JSON for CTS, deep sleep, and restoration
        type: string
        required: true
permissions:
  contents: write
  actions: read
  id-token: write
  attestations: write
concurrency:
  group: fedora-44-neo-edge-alpha-1
  cancel-in-progress: false
jobs:
  delivery:
    if: github.repository == 'aurora-silicon/fedora-aurora' && github.ref == 'refs/heads/main'
    uses: aurora-silicon/aurora-distributions/.github/workflows/build-payload.yml@2fb8891d0daaff6abbef08aef77c4c0e0dbf6319
    with:
      profile: fedora-kde
      image-run: '44380859872'
      neo-edge-evidence: ${{ inputs.qualification }}
    secrets:
      INSTALLER_CATALOG_SIGNING_KEY: ${{ secrets.INSTALLER_CATALOG_SIGNING_KEY }}
