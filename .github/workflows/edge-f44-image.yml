name: Assemble the F44 Neo Edge image artifact (linux e0ee46a1, mesa 418bf795)
on:
  push:
    branches: [edge/neo-f44-image-e0ee46a1]
    paths: [.github/neo-edge-signing.json]
permissions:
  contents: read
  actions: read
  attestations: write
  id-token: write
env:
  SIGNING_RUN: '44694386531'
  SIGNING_HEAD: '86ac3540dc87048ae91c4fae28c659529256e34f'
  PACKAGE_HEAD: aa7aca2e85e0ccee36fb5df45921804726538cb6
jobs:
  image:
    if: github.repository == 'aurora-silicon/fedora-aurora' && github.ref == 'refs/heads/edge/neo-f44-image-e0ee46a1'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Fetch the signed, equivalent F44 RPMs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          config=.github/neo-edge-signing.json
          jq -e --arg run "$SIGNING_RUN" --arg head "$SIGNING_HEAD" \
            '(.run|tostring)==$run and .head==$head' "$config"
          gh api "repos/aurora-silicon/fedora-aurora/actions/runs/$SIGNING_RUN" |
            jq -e --arg head "$SIGNING_HEAD" '.conclusion=="success" and .head_sha==$head
                    and .head_branch=="main" and .path==".github/workflows/edge-f44-sign-rpms.yml"'
          gh run download "$SIGNING_RUN" -R aurora-silicon/fedora-aurora -n f44-edge-signed-rpms -D signed
          for subject in signed/equivalence.json signed/rpms/*.rpm; do
            gh attestation verify "$subject" --repo aurora-silicon/fedora-aurora \
              --signer-workflow aurora-silicon/fedora-aurora/.github/workflows/edge-f44-sign-rpms.yml \
              --source-digest "$SIGNING_HEAD" --deny-self-hosted-runners
          done
          # The signer pins the package run to PACKAGE_HEAD; check the source pair it packaged.
          jq -e --arg head "$PACKAGE_HEAD" '.head_sha==$head and .path==".github/workflows/rpms.yml"' signed/build-run.json
          gh api "repos/aurora-silicon/fedora-aurora/contents/sources.json?ref=$PACKAGE_HEAD" \
            -H 'Accept: application/vnd.github.raw+json' > signed-sources.json
      - name: Assemble from the frozen local RPM repository
        run: |
          set -euo pipefail
          mkdir -p out
          docker run --rm --privileged -v /dev:/dev -v /run/udev:/run/udev:ro -v "$PWD:/src" -w /src \
            -e SIGNING_RUN -e AURORA_EDGE_REPOSITORY=/src/out/edge-repo \
            registry.fedoraproject.org/fedora:44@sha256:b96f024cecbe9515eb049107d2856e7ad923f7aac09a3c90e7a0d52a46fa3454 bash -euo pipefail -c '
              dnf install -y kiwi-cli kiwi-systemdeps distribution-gpg-keys git gnupg2 python3 xz zstd btrfs-progs cryptsetup util-linux cpio e2fsprogs createrepo_c curl rpm cpio
              python3 .github/scripts/edge-f44-repository.py signed signed-sources.json out/edge-repo out/edge-repository-receipt.json "$SIGNING_RUN"
              bash scripts/build-image fedora-kde
            ' 2>&1 | tee image-build.log
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            out/fedora-kde-filesystems.tar.zst
            out/fedora-kde-installer/edge-image-proof.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fedora-kde-edge-candidate
          compression-level: 0
          path: |
            out/fedora-kde-filesystems.tar.zst*
            out/fedora-kde-installer/edge-image-proof.json
            out/fedora-kde-installer/image.json
            out/edge-repository-receipt.json
            image-build.log
      # The proof alone, so later steps can read its digest without the 5 GB candidate.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fedora-kde-edge-image-proof
          path: |
            out/fedora-kde-installer/edge-image-proof.json
            out/edge-repository-receipt.json
          if-no-files-found: error
