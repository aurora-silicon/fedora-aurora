name: Source checks
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      graphics_runs:
        description: Space-separated successful RPM build run IDs to validate
        default: ''
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: |
          sudo apt-get update
          sudo apt-get install -y device-tree-compiler shellcheck cpio
          shellcheck -s bash packages/update-aura/mount-system-esp.sh
          shellcheck -s sh packages/aurora-firmware/verify-vendor-firmware.sh
          shellcheck packages/update-aura/update-aura packages/update-aura/aurora-stage2-commit packages/update-aura/*.install scripts/test-stage2-transactions scripts/test-bootchain-upgrade
          python3 -m unittest discover -s tests -p 'test_*.py'
          python3 images/test_configure.py
          python3 -m compileall -q scripts images
          for script in scripts/build-rpm scripts/build-flatpak-gl-repo \
            packages/aurora-flatpak-gl/build-extension.sh scripts/test-graphics-upgrade scripts/test-fex-overlay-upgrade scripts/test-fex-guest-default scripts/test-fex-binfmt scripts/test-touchid-upgrade scripts/test-fedora-repository scripts/check-repository-closure scripts/test-repository-closure scripts/test-fedora44-compatibility scripts/test-system-upgrade scripts/test-vendor-change scripts/test-repo-trust scripts/test-bootchain-upgrade packages/update-aura/update-aura packages/update-aura/aurora-stage2-commit scripts/fleet-kit/*.sh; do
            bash -n "$script"
          done
          git diff --check
      - name: No recipe builds an older EVR than the published repository
        run: |
          sudo apt-get install -y --no-install-recommends rpm zstd >/dev/null
          python3 scripts/check-published-evr.py
  vendor-policy:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        release: ['44', '45']
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Vendor change policies with vendor changes switched off
        run: |
          docker run --rm -v "$PWD:/src:ro" registry.fedoraproject.org/fedora:${{ matrix.release }} \
            bash -euo pipefail -c '
              bash /src/scripts/test-vendor-change /src/packages/aurora-repos
              if [[ $(rpm --eval "%{fedora}") == 44 ]]; then
                bash /src/scripts/test-fedora44-compatibility
              fi
            '
  repository-closure:
    # The publish check (publish.yml, publish-edge.yml) on probe packages: a
    # kernel whose avd-fw floor the set does not meet is refused, also with the
    # fleet's exclude and in an Edge snapshot over a Testing base.
    runs-on: ubuntu-24.04-arm
    strategy:
      matrix:
        release: ['44', '45']
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: The closure check refuses a kernel whose Requires the set cannot satisfy
        run: |
          docker run --rm -v "$PWD:/src:ro" registry.fedoraproject.org/fedora:${{ matrix.release }} \
            bash /src/scripts/test-repository-closure
  repo-trust:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        release: ['44', '45']
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Aurora repository refreshes and updates without key prompts
        run: |
          docker run --rm -v "$PWD:/src:ro" registry.fedoraproject.org/fedora:${{ matrix.release }} \
            bash /src/scripts/test-repo-trust /src/packages/aurora-repos
  fex-guest-default:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      matrix:
        release: ['44', '45']
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: dnf adds the FEX guest Mesa; FEX's RootFS follows its provider under systemd
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/old" "$RUNNER_TEMP/proof"
          # fex-emu 2610-5, the release systems upgrade from.
          git archive f4cde0d16e318007d2ba9ebd277a0d05064c1134 packages/fex-emu | tar -x -C "$RUNNER_TEMP/old"
          docker build -t aurora-fex-systemd:${{ matrix.release }} - <<'DOCKER'
          FROM registry.fedoraproject.org/fedora:${{ matrix.release }}
          RUN dnf install -y systemd util-linux rpm-build createrepo_c python3 systemd-rpm-macros && dnf clean all
          CMD ["/sbin/init"]
          DOCKER
          trap 'docker logs fex-guest > "$RUNNER_TEMP/proof/systemd.log" 2>&1; docker rm -f fex-guest' EXIT
          # Returns once systemd reports start-up finished (READY=1).
          python3 scripts/start-systemd-container.py fex-guest --privileged --cgroupns=host \
            -v /sys/fs/cgroup:/sys/fs/cgroup:rw --tmpfs /run --tmpfs /tmp \
            -v "$PWD:/src:ro" -v "$RUNNER_TEMP/old:/old:ro" -v "$RUNNER_TEMP/proof:/proof" \
            aurora-fex-systemd:${{ matrix.release }}
          docker exec fex-guest systemctl is-active multi-user.target
          docker exec fex-guest bash /src/scripts/test-fex-guest-default /old/packages/fex-emu /src/packages /proof
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: fex-guest-default-${{ matrix.release }}
          path: ${{ runner.temp }}/proof/
          retention-days: 30
  fex-binfmt:
    # binfmt_misc needs the host's arch for an x86 program to reach a handler.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    strategy:
      matrix:
        release: ['44', '45']
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: FEX's handlers alone run x86 programs beside binfmt-dispatcher, with the programs' own arguments
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/old" "$RUNNER_TEMP/proof"
          # fex-emu 2610-6, the release Asahi-upgraded systems upgrade from.
          git archive 329148458f3634528dadd5cd368c1c171235900d packages/fex-emu | tar -x -C "$RUNNER_TEMP/old"
          docker build -t aurora-fex-binfmt:${{ matrix.release }} - <<'DOCKER'
          FROM registry.fedoraproject.org/fedora:${{ matrix.release }}
          RUN dnf install -y systemd util-linux rpm-build createrepo_c python3 systemd-rpm-macros gcc && dnf clean all
          CMD ["/sbin/init"]
          DOCKER
          trap 'docker logs fex-binfmt > "$RUNNER_TEMP/proof/systemd.log" 2>&1; docker rm -f fex-binfmt' EXIT
          # Returns once systemd reports start-up finished (READY=1).
          python3 scripts/start-systemd-container.py fex-binfmt --privileged --cgroupns=host \
            -v /sys/fs/cgroup:/sys/fs/cgroup:rw --tmpfs /run --tmpfs /tmp \
            -v "$PWD:/src:ro" -v "$RUNNER_TEMP/old:/old:ro" -v "$RUNNER_TEMP/proof:/proof" \
            aurora-fex-binfmt:${{ matrix.release }}
          docker exec fex-binfmt systemctl is-active multi-user.target
          docker exec fex-binfmt bash /src/scripts/test-fex-binfmt /old/packages/fex-emu /src/packages /proof
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: fex-binfmt-${{ matrix.release }}
          path: ${{ runner.temp }}/proof/
          retention-days: 30
  graphics:
    if: github.event_name == 'workflow_dispatch' && inputs.graphics_runs != ''
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      GRAPHICS_RUNS: ${{ inputs.graphics_runs }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Download and authenticate candidate inputs
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/candidates"
          for run in $GRAPHICS_RUNS; do
            [[ $run =~ ^[0-9]+$ ]]
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run" > "$RUNNER_TEMP/run-$run.json"
            artifacts=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run/artifacts" --jq '.artifacts[].name')
            for package in mesa-aurora mesa-aurora-fex-guest aurora-flatpak-gl; do
              artifact=rpm-$package
              if grep -Fx "$artifact" <<< "$artifacts" >/dev/null; then
                # Explicit destinations preserve the importer's layout even
                # when a run contains just one artifact.
                gh run download "$run" --repo "$GITHUB_REPOSITORY" --name "$artifact" \
                  --dir "$RUNNER_TEMP/run-$run/$artifact"
              fi
            done
            python3 scripts/import-rpm-build.py --metadata "$RUNNER_TEMP/run-$run.json" \
              --artifacts "$RUNNER_TEMP/run-$run" --output "$RUNNER_TEMP/candidates" \
              --repository "$GITHUB_REPOSITORY" --matching-only \
              --packages mesa-aurora mesa-aurora-fex-guest aurora-flatpak-gl
          done
          for package in mesa-aurora mesa-aurora-fex-guest aurora-flatpak-gl; do
            test -f "$RUNNER_TEMP/candidates/manifests/$package.json"
          done
          for pair in 9:testing-20261030.10 10:testing-20261030.11; do
            number=${pair%%:*}; tag=${pair#*:}
            mkdir -p "$RUNNER_TEMP/baselines/$number"
            gh release download "$tag" --repo "$GITHUB_REPOSITORY" \
              --pattern 'mesa-aurora-*.aarch64.rpm' --pattern 'mesa-aurora-*.noarch.rpm' \
              --pattern 'aurora-flatpak-gl-*.aarch64.rpm' \
              --pattern SHA256SUMS --dir "$RUNNER_TEMP/baselines/$number"
            (cd "$RUNNER_TEMP/baselines/$number" && sha256sum --check --ignore-missing SHA256SUMS)
          done
      - name: Check built payloads and perform clean DNF upgrades
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/proof"
          docker run --rm --platform linux/arm64 -v "$RUNNER_TEMP/candidates:/candidates" \
            registry.fedoraproject.org/fedora:44 bash -euxo pipefail -c '
              dnf install -y createrepo_c
              createrepo_c /candidates/rpms
            '
          for baseline in 9 10 fedora; do
            mkdir -p "$RUNNER_TEMP/proof/result-$baseline"
            # Independent disposable container/RPM database for every baseline.
            docker run --rm --platform linux/arm64 \
              -v "$PWD:/src:ro" -v "$RUNNER_TEMP/candidates/rpms:/candidates:ro" \
              -v "$RUNNER_TEMP/baselines:/baselines:ro" \
              -v "$RUNNER_TEMP/proof/result-$baseline:/proof" \
              registry.fedoraproject.org/fedora:44 bash -euxo pipefail -c '
                dnf install -y rpm-build ostree python3 binutils dnf5-plugins
                rpm --import /src/keys/RPM-GPG-KEY-aurora
                for rpm in /baselines/{9,10}/*.rpm; do rpmkeys --checksig "$rpm"; done
                old=/baselines/$1
                [[ $1 == fedora ]] && old=fedora
                bash /src/scripts/test-graphics-upgrade "$old" /candidates /proof
              ' validation "$baseline" 2>&1 | tee "$RUNNER_TEMP/proof/validation-$baseline.log"
          done
      - name: Upgrade FEX with its read-only overlay running under systemd
        run: |
          set -euo pipefail
          docker build -t aurora-fex-systemd - <<'DOCKER'
          FROM registry.fedoraproject.org/fedora:44
          RUN dnf install -y systemd util-linux dnf5-plugins rpm-build && dnf clean all
          CMD ["/sbin/init"]
          DOCKER
          trap 'docker logs fex-overlay > "$RUNNER_TEMP/proof/systemd.log" 2>&1; docker rm -f fex-overlay' EXIT
          # Returns once systemd reports start-up finished (READY=1).
          python3 scripts/start-systemd-container.py fex-overlay --privileged --cgroupns=host \
            -v /sys/fs/cgroup:/sys/fs/cgroup:rw --tmpfs /run --tmpfs /tmp \
            -v "$PWD:/src:ro" -v "$RUNNER_TEMP/candidates/rpms:/candidates:ro" \
            -v "$RUNNER_TEMP/baselines:/baselines:ro" -v "$RUNNER_TEMP/proof:/proof" aurora-fex-systemd
          docker exec fex-overlay systemctl is-active multi-user.target
          docker exec fex-overlay bash /src/scripts/test-fex-overlay-upgrade /baselines/10 /candidates /proof/fex-overlay
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: graphics-validation
          path: |
            ${{ runner.temp }}/proof/validation-*.log
            ${{ runner.temp }}/proof/result-*/
            ${{ runner.temp }}/proof/fex-overlay/
            ${{ runner.temp }}/proof/systemd.log
          retention-days: 30
