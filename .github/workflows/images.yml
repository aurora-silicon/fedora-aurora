name: Native Fedora Aurora images
on:
  workflow_dispatch:
    inputs:
      profile:
        description: Installation profile
        type: choice
        options: [fedora-minimal, fedora-kde, fedora-gnome]
        default: fedora-minimal
      channel:
        description: Update channel the installed system follows (testing keeps today's repository URL)
        type: choice
        options: [testing, stable]
        default: testing
      fedora-release:
        description: Fedora release of the image (44 is frozen)
        type: choice
        options: ['45', '44']
        default: '45'
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  image:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Build the image using verified Fedora and Aurora repositories
        env:
          PROFILE: ${{ inputs.profile }}
          CHANNEL: ${{ inputs.channel || 'testing' }}
          FEDORA_RELEASE: ${{ inputs.fedora-release || '45' }}
        run: |
          set -euo pipefail
          [[ $FEDORA_RELEASE == 44 || $FEDORA_RELEASE == 45 ]]
          docker run --rm --privileged -v /dev:/dev -v /run/udev:/run/udev:ro -v "$PWD:/src" -w /src \
            -e AURORA_REPOSITORY_URL="https://aurorasilicon.org/fedora-aurora/\$releasever/$CHANNEL/aarch64" \
            "registry.fedoraproject.org/fedora:$FEDORA_RELEASE" bash -euo pipefail -c '
              dnf install -y kiwi-cli kiwi-systemdeps distribution-gpg-keys git gnupg2 python3 xz zstd btrfs-progs cryptsetup util-linux cpio e2fsprogs
              bash scripts/build-image "$1"
            ' image "$PROFILE" 2>&1 | tee image-build.log
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: success()
        with:
          subject-path: out/*-filesystems.tar.zst
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          # Fedora 44 candidates keep a separate name, so the payload workflow,
          # which takes only <profile>-candidate, never publishes them.
          name: ${{ inputs.profile }}${{ inputs.fedora-release == '44' && '-f44' || '' }}-candidate
          compression-level: 0
          path: |
            image-build.log
            out/*-filesystems.tar.zst*
            out/*-installer/image.json
            out/*-installer/initramfs-inventory.txt
            out/*-image/*.xz
            out/*-image/*.sha256
            out/*-image/*.packages
            out/*-image/*.log
            out/*-description/aurora-image.json
          retention-days: 14
