name: Firefox RDD V4L2 Request test build
# Hardware-qualification build of Firefox 157.0.1 (Fedora 44) with the RDD sandbox
# delta in docs/firefox. Not a publication path: no attestation, no repo upload.
on:
  push:
    branches: [ci/firefox-rdd-v4l2-request-build, ci/ffx-upstream-retest-20261108]
    paths: [docs/firefox/**, scripts/build-firefox-rdd-v4l2-request, .github/workflows/firefox-rdd-test-build.yml]
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  firefox:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Free disk
        run: |
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/dotnet /usr/local/share/boost /opt/hostedtoolcache /usr/local/.ghcup || true
          docker system prune -af || true
          df -h "$GITHUB_WORKSPACE"
          # gkrust (the Rust half of libxul) was killed at 16 GB with 4 jobs: add swap, use 3 jobs.
          sudo swapoff -a || true
          sudo fallocate -l 24G /swapfile && sudo chmod 600 /swapfile && sudo mkswap /swapfile && sudo swapon /swapfile
          free -g
      - name: Build Firefox RPMs natively (Fedora 44 aarch64)
        run: |
          set -euo pipefail
          mkdir -p out
          docker run --rm --platform linux/arm64 -e AURORA_FIREFOX_TEST_BUILD=1 -e AURORA_BUILD_JOBS=3 -e AURORA_DNF_EXTRA=--enablerepo=updates-testing -e BUILD_OUT=/src/out \
            -v "$PWD:/src" -w /src registry.fedoraproject.org/fedora:44 bash -euo pipefail -c '
              dnf install -y git python3 fedpkg rpm-build dnf5-plugins redhat-rpm-config kernel-headers
              git config --global --add safe.directory /src
              bash scripts/build-firefox-rdd-v4l2-request
            '
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: firefox-fc44-rdd-v4l2-request-${{ github.ref_name == 'ci/ffx-upstream-retest-20261108' && 'upstream' || 'fedora' }}
          path: |
            out/firefox-fc44/RPMS/**/*.rpm
            out/firefox-fc44/rpm-sha256.txt
            out/firefox-fc44/build.log
          retention-days: 14
