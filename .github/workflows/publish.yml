name: Publish signed testing repository
on:
  workflow_dispatch:
    inputs:
      build-run:
        description: Optional native RPM run IDs (recipes must match merged main). Empty resolves the newest build of every package
        default: ''
      base-release:
        description: Optional snapshot supplying unchanged packages. Empty uses the newest testing-* release
        default: ''
      release-tag:
        description: Optional new tag. Empty creates testing-YYYYMMDD.N
        default: ''
      deploy:
        description: Make the snapshot the live testing feed (auto follows the AUTO_DEPLOY_TESTING variable)
        type: choice
        options: [auto, 'yes', 'no']
        default: auto
      allow-downgrade:
        description: Publish even if a package version would go backwards
        type: boolean
        default: false
      dry-run:
        description: Resolve, assemble and sign with a throwaway key; publish nothing
        type: boolean
        default: false
  workflow_run:
    workflows: [Fedora RPM builds]
    types: [completed]
    branches: [main]
  schedule:
    - cron: '41 */6 * * *'
permissions: {}
defaults:
  run:
    shell: bash
concurrency:
  group: repository-publication
  cancel-in-progress: false
env:
  FEDORA_IMAGE: registry.fedoraproject.org/fedora:44@sha256:b96f024cecbe9515eb049107d2856e7ad923f7aac09a3c90e7a0d52a46fa3454
jobs:
  plan:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (vars.AUTO_PUBLISH_TESTING == 'true' &&
       (github.event_name == 'schedule' || github.event.workflow_run.conclusion == 'success'))
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    outputs:
      action: ${{ steps.resolve.outputs.action }}
      rebuild: ${{ steps.resolve.outputs.rebuild }}
      base-release: ${{ steps.resolve.outputs.base_release }}
      release-tag: ${{ steps.tag.outputs.tag }}
      dry-run: ${{ steps.mode.outputs.dry-run }}
      deploy: ${{ steps.mode.outputs.deploy }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: mode
        env:
          DRY_RUN: ${{ inputs.dry-run || false }}
          DEPLOY: ${{ inputs.deploy || 'auto' }}
          AUTO_DEPLOY: ${{ vars.AUTO_DEPLOY_TESTING }}
        run: |
          if [[ $DRY_RUN != true && $GITHUB_REF != refs/heads/main ]]; then
            echo 'Only main publishes; use dry-run on other branches.' >&2
            exit 1
          fi
          deploy=false
          if [[ $DEPLOY == yes || ( $DEPLOY == auto && $AUTO_DEPLOY == true ) ]]; then deploy=true; fi
          [[ $DRY_RUN != true ]] || deploy=false
          printf 'dry-run=%s\ndeploy=%s\n' "$DRY_RUN" "$deploy" >> "$GITHUB_OUTPUT"
      - id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN: ${{ inputs.build-run }}
          BASE_RELEASE: ${{ inputs.base-release }}
        run: |
          set -euo pipefail
          options=()
          if [[ -n $BASE_RELEASE ]]; then
            [[ $BASE_RELEASE =~ ^testing-[A-Za-z0-9._-]+$ ]]
            options+=(--base-release "$BASE_RELEASE")
          fi
          if [[ -n $BUILD_RUN ]]; then
            read -r -a runs <<< "$BUILD_RUN"
            for run in "${runs[@]}"; do [[ $run =~ ^[0-9]+$ ]]; done
            printf 'action=publish\nrebuild=\nbase_release=%s\n' "$BASE_RELEASE" >> "$GITHUB_OUTPUT"
            jq -n --arg runs "$BUILD_RUN" '{explicit_runs: $runs}' > build-plan.json
          else
            python3 scripts/resolve-build-runs.py --repository "$GITHUB_REPOSITORY" "${options[@]}" \
              --output build-plan.json | tee -a "$GITHUB_STEP_SUMMARY"
          fi
      - id: tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release-tag }}
        run: |
          set -euo pipefail
          if [[ -z $RELEASE_TAG ]]; then
            gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[].tag_name' > existing-tags
            RELEASE_TAG=$(python3 scripts/next-tag.py testing- < existing-tags)
          fi
          [[ $RELEASE_TAG =~ ^testing-[A-Za-z0-9._-]+$ ]]
          ! gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: build-plan
          path: build-plan.json
          retention-days: 30

  collect:
    needs: plan
    if: needs.plan.outputs.action == 'publish'
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      actions: read
      attestations: read
    outputs:
      status: ${{ steps.assemble.outputs.status }}
      rebuild: ${{ steps.assemble.outputs.rebuild }}
      digest: ${{ steps.bundle.outputs.digest }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: build-plan
      - name: Authenticate every chosen native build
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN: ${{ inputs.build-run }}
        run: |
          set -euo pipefail
          if [[ -n $BUILD_RUN ]]; then
            read -r -a runs <<< "$BUILD_RUN"
            for run in "${runs[@]}"; do
              gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run" > "build-$run.json"
              gh run download "$run" --repo "$GITHUB_REPOSITORY" --pattern 'rpm-*' --dir "downloaded/$run"
              python3 scripts/import-rpm-build.py --metadata "build-$run.json" --artifacts "downloaded/$run" \
                --repository "$GITHUB_REPOSITORY" --output input-build --matching-only
            done
          else
            python3 scripts/collect-builds.py --plan build-plan.json --repository "$GITHUB_REPOSITORY" \
              --output input-build --downloads downloaded
            cp downloaded/build-*.json .
          fi
      - id: assemble
        name: Merge with the base snapshot and refuse version regressions
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_RELEASE: ${{ needs.plan.outputs.base-release }}
          ALLOW_DOWNGRADE: ${{ inputs.allow-downgrade || false }}
          BUILD_RUN: ${{ inputs.build-run }}
        run: |
          set -euo pipefail
          options=()
          if [[ -n $BASE_RELEASE ]]; then
            [[ $BASE_RELEASE =~ ^testing-[A-Za-z0-9._-]+$ ]]
            gh release download "$BASE_RELEASE" --repo "$GITHUB_REPOSITORY" --pattern '*.rpm' --pattern manifest.json --dir base-rpms
            options=(--base base-rpms)
          fi
          check=(--old base-rpms --new complete-rpms)
          [[ $ALLOW_DOWNGRADE != true ]] || check+=(--allow-downgrade)
          if docker run --rm -v "$PWD:/src" -w /src "$FEDORA_IMAGE" bash -euo pipefail -c '
              dnf install -y rpm-build python3 zstd >/dev/null
              python3 scripts/assemble-repository.py "$@" --candidates input-build/rpms --output complete-rpms \
                --missing-output missing-packages.txt
            ' assemble "${options[@]}"; then
            status=complete
          elif [[ -s missing-packages.txt ]]; then
            echo 'status=missing' >> "$GITHUB_OUTPUT"
            echo "rebuild=$(cat missing-packages.txt)" >> "$GITHUB_OUTPUT"
            echo "Packages without a current build: $(cat missing-packages.txt)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          else
            exit 1
          fi
          sudo chown -R "$(id -u):$(id -g)" complete-rpms
          if [[ -d base-rpms ]]; then
            docker run --rm -v "$PWD:/src" -w /src "$FEDORA_IMAGE" bash -euo pipefail -c '
                dnf install -y rpm python3 >/dev/null
                python3 scripts/check-feed-versions.py "$@" --changes-output changes.txt
              ' check "${check[@]}" | tee -a "$GITHUB_STEP_SUMMARY"
            # The same package versions as the base snapshot: nothing to publish.
            if [[ $(cat changes.txt) == 0 && -z $BUILD_RUN ]]; then
              echo "Every package matches $BASE_RELEASE; no new snapshot." >> "$GITHUB_STEP_SUMMARY"
              status=unchanged
            fi
          fi
          echo "status=$status" >> "$GITHUB_OUTPUT"
      - id: bundle
        if: steps.assemble.outputs.status == 'complete'
        run: |
          set -euo pipefail
          mkdir candidate
          mv complete-rpms candidate/
          mkdir -p candidate/srpms candidate/manifests candidate/builds
          cp input-build/srpms/*.src.rpm candidate/srpms/ 2>/dev/null || true
          cp input-build/manifests/*.json candidate/manifests/
          cp build-*.json candidate/builds/
          tar --sort=name --owner=0 --group=0 --numeric-owner --mtime=@0 -cf candidate.tar -C candidate .
          echo "digest=$(sha256sum candidate.tar | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: steps.assemble.outputs.status == 'complete'
        with:
          name: unsigned-candidate
          path: candidate.tar
          compression-level: 0
          retention-days: 7

  request-builds:
    needs: [plan, collect]
    if: >-
      always() && needs.plan.outputs.dry-run != 'true' &&
      (needs.plan.outputs.action == 'missing' || needs.collect.outputs.status == 'missing')
    runs-on: ubuntu-24.04
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          REBUILD: ${{ needs.collect.outputs.rebuild || needs.plan.outputs.rebuild }}
        run: |
          set -euo pipefail
          active=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/rpms.yml/runs?branch=main&per_page=20" \
            --jq '[.workflow_runs[] | select(.status != "completed")] | length')
          if (( active )); then
            echo "A main RPM build is already running; publication waits for it." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          gh workflow run rpms.yml --repo "$GITHUB_REPOSITORY" --ref main -f packages="$REBUILD"
          echo "Requested native builds on main: ${REBUILD:-all packages}" >> "$GITHUB_STEP_SUMMARY"

  sign:
    # The RPM key lives in the testing-signing environment (main only). The
    # signer gets only the verified candidate and reads the key from stdin
    # inside a container without network access.
    needs: [plan, collect]
    if: needs.plan.outputs.dry-run != 'true' && needs.collect.outputs.status == 'complete'
    runs-on: ubuntu-24.04-arm
    environment: testing-signing
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: unsigned-candidate
      - env:
          DIGEST: ${{ needs.collect.outputs.digest }}
        run: |
          echo "$DIGEST  candidate.tar" | sha256sum -c -
          mkdir candidate && tar -xf candidate.tar -C candidate
          docker build -t aurora-signer - <<EOF
          FROM $FEDORA_IMAGE
          RUN dnf install -y rpm-build redhat-rpm-config rpm-sign gnupg2 createrepo_c python3 && dnf clean all
          EOF
      - name: Sign RPMs and repository metadata
        env:
          FEDORA_RPM_SIGNING_KEY: ${{ secrets.FEDORA_RPM_SIGNING_KEY }}
          FEDORA_RPM_SIGNING_PASSPHRASE: ${{ secrets.FEDORA_RPM_SIGNING_PASSPHRASE }}
          RELEASE_TAG: ${{ needs.plan.outputs.release-tag }}
        run: |
          set -euo pipefail
          jq -n '{key: env.FEDORA_RPM_SIGNING_KEY, passphrase: env.FEDORA_RPM_SIGNING_PASSPHRASE}' |
            docker run --rm -i --network none -v "$PWD:/src" -w /src aurora-signer \
              python3 scripts/sign-repository.py --credentials-stdin --rpms candidate/complete-rpms --output site \
                --snapshot "$RELEASE_TAG" --asset-base "https://github.com/$GITHUB_REPOSITORY/releases/download/$RELEASE_TAG"
          sudo chown -R "$(id -u):$(id -g)" site
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: signed-snapshot
          path: |
            site
            candidate/srpms
            candidate/manifests
            candidate/builds
          compression-level: 0
          retention-days: 7

  sign-dry-run:
    needs: [plan, collect]
    if: needs.plan.outputs.dry-run == 'true' && needs.collect.outputs.status == 'complete'
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: unsigned-candidate
      - env:
          DIGEST: ${{ needs.collect.outputs.digest }}
          RELEASE_TAG: ${{ needs.plan.outputs.release-tag }}
        run: |
          set -euo pipefail
          echo "$DIGEST  candidate.tar" | sha256sum -c -
          mkdir candidate && tar -xf candidate.tar -C candidate
          docker build -t aurora-signer - <<EOF
          FROM $FEDORA_IMAGE
          RUN dnf install -y rpm-build redhat-rpm-config rpm-sign gnupg2 createrepo_c python3 && dnf clean all
          EOF
          export GNUPGHOME="$RUNNER_TEMP/dry-run-gnupg"
          mkdir -m 0700 "$GNUPGHOME"
          gpg --batch --pinentry-mode loopback --passphrase dry-run \
            --quick-gen-key 'Fedora Aurora dry run <dry-run@aurorasilicon.invalid>' rsa4096 sign 1d
          gpg --batch --armor --export > dry-run.asc
          gpg --batch --pinentry-mode loopback --passphrase dry-run --armor --export-secret-keys |
            jq -Rs '{key: ., passphrase: "dry-run"}' |
            docker run --rm -i --network none -v "$PWD:/src" -w /src aurora-signer \
              python3 scripts/sign-repository.py --credentials-stdin --dry-run-public-key dry-run.asc \
                --rpms candidate/complete-rpms --output site --snapshot "$RELEASE_TAG" \
                --asset-base "https://github.com/$GITHUB_REPOSITORY/releases/download/$RELEASE_TAG"
          sudo chown -R "$(id -u):$(id -g)" site
          { echo '### Dry run'; echo; echo 'Signed with a throwaway key; nothing was published.'; echo;
            jq -r '.packages[] | "- \(.filename)"' site/44/testing/aarch64/manifest.json; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dry-run-repository-metadata
          path: |
            site/44/testing/aarch64/repodata
            site/44/testing/aarch64/manifest.json
          retention-days: 3

  release:
    needs: [plan, sign]
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: write
      id-token: write
      attestations: write
    outputs:
      tag: ${{ needs.plan.outputs.release-tag }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: signed-snapshot
      - name: Verify every signature against the committed key
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD:/src" -w /src "$FEDORA_IMAGE" bash -euo pipefail -c '
              rpmkeys --import keys/RPM-GPG-KEY-aurora
              for rpm in site/44/testing/aarch64/*.rpm; do
                [[ $(rpmkeys --checksig "$rpm") == *"digests signatures OK"* ]] || { echo "unsigned: $rpm" >&2; exit 1; }
              done
            '
          export GNUPGHOME="$RUNNER_TEMP/verify"
          mkdir -m 0700 "$GNUPGHOME"
          gpg --batch --import keys/RPM-GPG-KEY-aurora
          gpg --batch --verify site/44/testing/aarch64/repodata/repomd.xml.asc site/44/testing/aarch64/repodata/repomd.xml
          for archive in site/repository-metadata-*.tar.gz; do gpg --batch --verify "$archive.asc" "$archive"; done
          jq -e '.dry_run != true and .signing_key == $fpr' --arg fpr "$(cat keys/fingerprint.txt)" \
            site/44/testing/aarch64/manifest.json
      - name: Record provenance
        env:
          BASE_RELEASE: ${{ needs.plan.outputs.base-release }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          runs=[json.loads(p.read_text()) for p in sorted(Path('candidate/builds').glob('build-*.json'))]
          receipts=[json.loads(p.read_text()) for p in sorted(Path('candidate/manifests').glob('*.json'))]
          record={'schema':1,'publishing_commit':os.environ['GITHUB_SHA'],'base_release':os.environ['BASE_RELEASE'],
                  'builds':[{k:run[k] for k in ('id','head_sha','path','event','conclusion')} for run in runs],
                  'receipts':receipts}
          Path('site/builds.json').write_text(json.dumps(record,indent=2)+'\n')
          PY
          mkdir assets
          cp site/44/testing/aarch64/*.rpm site/44/testing/aarch64/manifest.json site/RPM-GPG-KEY-aurora \
            site/builds.json site/repository-metadata-*.tar.gz site/repository-metadata-*.tar.gz.asc assets/
          cp candidate/srpms/*.src.rpm assets/ 2>/dev/null || true
          (cd assets && sha256sum -- * > ../SHA256SUMS) && mv SHA256SUMS assets/
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: assets/SHA256SUMS
      - name: Publish the immutable snapshot
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.plan.outputs.release-tag }}
        run: |
          gh release create "$RELEASE_TAG" assets/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --prerelease --title "Fedora Aurora $RELEASE_TAG" \
            --notes 'Signed development package set. Every asset carries a GitHub build provenance attestation (SHA256SUMS). Deploying it to a channel is a separate step; image installation qualification is recorded separately.'
          echo "Published [$RELEASE_TAG](https://github.com/$GITHUB_REPOSITORY/releases/tag/$RELEASE_TAG)." >> "$GITHUB_STEP_SUMMARY"

  deploy:
    needs: [plan, release]
    if: needs.plan.outputs.deploy == 'true'
    permissions:
      contents: write
      pages: write
      id-token: write
      attestations: read
      actions: write
    uses: ./.github/workflows/deploy-snapshot.yml
    with:
      channel: testing
      release-tag: ${{ needs.release.outputs.tag }}
