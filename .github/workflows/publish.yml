name: Publish signed testing repository
on:
  workflow_dispatch:
    inputs:
      build-run:
        description: Successful native RPM run IDs; recipes must match merged main
        required: true
      base-release:
        description: Existing immutable testing snapshot to preserve unchanged packages
        default: ''
      release-tag:
        description: New immutable testing release tag
        required: true
permissions:
  contents: write
  actions: read
  pages: write
  id-token: write
defaults:
  run:
    shell: bash
concurrency:
  group: repository-publication
  cancel-in-progress: false
jobs:
  repository:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04-arm
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Validate the candidate build
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ inputs.build-run }}
          RELEASE_TAG: ${{ inputs.release-tag }}
          BASE_RELEASE: ${{ inputs.base-release }}
        run: |
          [[ $RELEASE_TAG =~ ^testing-[A-Za-z0-9._-]+$ ]]
          read -r -a runs <<< "$RUN"
          ((${#runs[@]}))
          for run in "${runs[@]}"; do
            [[ $run =~ ^[0-9]+$ ]]
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run" > "build-$run.json"
            gh run download "$run" --repo "$GITHUB_REPOSITORY" --pattern 'rpm-*' --dir "downloaded/$run"
            python3 scripts/import-rpm-build.py --metadata "build-$run.json" --artifacts "downloaded/$run" \
              --repository "$GITHUB_REPOSITORY" --output input-build --matching-only
          done
          if [[ -n $BASE_RELEASE ]]; then
            [[ $BASE_RELEASE =~ ^testing-[A-Za-z0-9._-]+$ ]]
            gh release download "$BASE_RELEASE" --repo "$GITHUB_REPOSITORY" --pattern '*.rpm' --pattern manifest.json --dir base-rpms
          fi
      - name: Sign RPMs and repository metadata
        env:
          FEDORA_RPM_SIGNING_KEY: ${{ secrets.FEDORA_RPM_SIGNING_KEY }}
          FEDORA_RPM_SIGNING_PASSPHRASE: ${{ secrets.FEDORA_RPM_SIGNING_PASSPHRASE }}
          RELEASE_TAG: ${{ inputs.release-tag }}
        run: |
          docker run --rm -v "$PWD:/src" -w /src \
            -e FEDORA_RPM_SIGNING_KEY -e FEDORA_RPM_SIGNING_PASSPHRASE -e RELEASE_TAG -e GITHUB_REPOSITORY \
            registry.fedoraproject.org/fedora:44 bash -euo pipefail -c '
              dnf install -y rpm-build redhat-rpm-config rpm-sign gnupg2 createrepo_c python3
              options=()
              [[ ! -d base-rpms ]] || options=(--base base-rpms)
              python3 scripts/assemble-repository.py "${options[@]}" --candidates input-build/rpms --output complete-rpms
              python3 scripts/sign-repository.py --rpms complete-rpms --output site \
                --snapshot "$RELEASE_TAG" \
                --asset-base "https://github.com/$GITHUB_REPOSITORY/releases/download/$RELEASE_TAG"
            '
      - name: Return signed artifacts to the runner user
        run: sudo chown -R "$(id -u):$(id -g)" site
      - name: Upload immutable package assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release-tag }}
          BASE_RELEASE: ${{ inputs.base-release }}
        run: |
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          runs=[json.loads(p.read_text()) for p in sorted(Path('.').glob('build-*.json'))]
          receipts=[json.loads(p.read_text()) for p in sorted(Path('input-build/manifests').glob('*.json'))]
          record={'schema':1,'publishing_commit':os.environ['GITHUB_SHA'],'base_release':os.environ['BASE_RELEASE'],
                  'builds':[{k:run[k] for k in ('id','head_sha','path','event','conclusion')} for run in runs],
                  'receipts':receipts}
          Path('site/builds.json').write_text(json.dumps(record,indent=2)+'\n')
          PY
          gh release create "$RELEASE_TAG" site/44/testing/aarch64/*.rpm --target "$GITHUB_SHA" \
            site/44/testing/aarch64/manifest.json site/RPM-GPG-KEY-aurora site/builds.json \
            site/repository-metadata-*.tar.gz site/repository-metadata-*.tar.gz.asc \
            --prerelease --title "Fedora Aurora $RELEASE_TAG" \
            --notes 'Signed development package set. Image installation qualification is recorded separately.'
          source_rpms=(input-build/srpms/*.src.rpm)
          [[ ! -e ${source_rpms[0]} ]] || gh release upload "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" "${source_rpms[@]}"
          find site -name '*.rpm' -delete
          cp keys/fingerprint.txt site/fingerprint.txt
          printf '%s\n' 'Fedora Aurora Remix testing RPM repository' > site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
