name: Touch ID Fedora 45
on:
  push:
    branches: [main]
    paths: [sources.json, packages/aurora-sep/**, packages/aurora-xart/**, packages/libfprint/**, packages/fprintd/**, scripts/build-rpm, scripts/fetch-sources.py, scripts/build-receipt.py, scripts/test-touchid-upgrade, .github/workflows/touchid-fedora45.yml]
  pull_request:
    paths: [sources.json, packages/aurora-sep/**, packages/aurora-xart/**, packages/libfprint/**, packages/fprintd/**, scripts/build-rpm, scripts/fetch-sources.py, scripts/build-receipt.py, scripts/test-touchid-upgrade, .github/workflows/touchid-fedora45.yml]
  workflow_dispatch:
  workflow_call:
    inputs:
      ci-candidates:
        description: Validate the current rpms.yml run's Fedora 45 outputs
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  touchid:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          path: candidate
          persist-credentials: false
      # Rebuild the installed v5 baseline, rather than depending on expiring
      # artifacts from run 41147200126 (fedora-aurora#73).
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: 09dec299bf0bd35d1990038e9b10c75f3dea253f
          path: baseline
          persist-credentials: false
      # rpms.yml supplies the exact candidates already built in this run.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: inputs.ci-candidates
        with:
          name: rpm-f45-libfprint
          path: candidate
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: inputs.ci-candidates
        with:
          name: rpm-f45-fprintd
          path: candidate
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: inputs.ci-candidates
        with:
          name: rpm-f45-aurora-sep
          path: candidate
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: inputs.ci-candidates
        with:
          name: rpm-f45-aurora-xart
          path: candidate
      - name: Build native Fedora 45 candidates and Fedora 44 v5 baseline
        env:
          CI_CANDIDATES: ${{ inputs.ci-candidates || false }}
        run: |
          set -euo pipefail
          for pair in candidate:45 baseline:44; do
            tree=${pair%:*}; release=${pair#*:}
            if [[ $tree == candidate && $CI_CANDIDATES == true ]]; then continue; fi
            # aurora-sep requires aurora-xart since 1-21; the v5 baseline predates it.
            packages="libfprint fprintd aurora-sep"
            if [[ $tree == candidate ]]; then packages="libfprint fprintd aurora-xart aurora-sep"; fi
            docker run --rm --platform linux/arm64 -e PACKAGES="$packages" -v "$PWD/$tree:/src" -w /src \
              registry.fedoraproject.org/fedora:$release bash -euxo pipefail -c '
                dnf install -y rpm-build dnf5-plugins python3 git tar gzip coreutils findutils
                for package in $PACKAGES; do
                  AURORA_INSTALL_BUILDDEPS=1 AURORA_BUILD_JOBS=8 bash scripts/build-rpm "$package"
                done
              ' 2>&1 | tee build-fedora$release.log
          done
      - name: DNF upgrades from stock Fedora 45 and fc44 Aurora v5
        run: |
          set -euo pipefail
          for old in stock /baseline; do
            label=${old##*/}
            docker run --rm --platform linux/arm64 -v "$PWD/candidate:/src:ro" \
              -v "$PWD/baseline/out/rpms:/baseline:ro" \
              registry.fedoraproject.org/fedora:45 \
              bash /src/scripts/test-touchid-upgrade /src/out/rpms "$old" \
              2>&1 | tee upgrade-fedora45-$label.log
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: touchid-fedora45
          path: |
            candidate/out/rpms/*.rpm
            candidate/out/srpms/*.rpm
            candidate/out/manifests/*.json
            candidate/out/build/libfprint/BUILD/**/meson-logs/
            *-fedora*.log
          retention-days: 30
